version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: driveit
      POSTGRES_PASSWORD: driveit_pass
      POSTGRES_DB: driveit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driveit"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "5050:5050"
      - "5173:5173"
    environment:
      DATABASE_URL: postgresql://driveit:driveit_pass@postgres:5432/driveit_db
      JWT_SECRET: ${JWT_SECRET:-rideshare_super_secure_jwt_secret_key_2026_change_in_production}
      PORT: 5050
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "cd server && npx prisma migrate deploy && node src/index.js"

volumes:
  pgdata:
