version: '3.8'

services:
  # DriveIT Full-Stack App Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: driveit-app
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
      - JWT_SECRET=driveit_production_jwt_secret_2026_secure
      - DATABASE_URL=postgresql://driveit_user:driveit_secret_pass@db:5432/driveit_production_db
    depends_on:
      db:
        condition: service_healthy

  # Managed PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: driveit-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=driveit_user
      - POSTGRES_PASSWORD=driveit_secret_pass
      - POSTGRES_DB=driveit_production_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driveit_user -d driveit_production_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
